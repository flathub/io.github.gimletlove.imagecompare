app-id: io.github.gimletlove.imagecompare
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: imagecompare

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

cleanup:
  - /include
  - /lib/girepository-1.0
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/man
  - /bin/vips
  - /bin/vipsedit
  - /bin/vipsheader
  - /bin/vipsthumbnail
  
modules:
  - name: vips
    buildsystem: meson
    config-opts:
      - -Ddeprecated=false
      - -Dexamples=false
      - -Dintrospection=disabled
    sources:
      - type: archive
        url: https://github.com/libvips/libvips/releases/download/v8.18.3/vips-8.18.3.tar.xz
        sha256: f41285b61bfb495605494f074ca341f7791a1d406e2f157dcea606ef1ae1b146

  - name: imagecompare
    buildsystem: cmake-ninja
    config-opts:
      - -DIMAGECOMPARE_FLATPAK=ON
    sources:
      - type: archive
        url: https://github.com/gimletlove/imagecompare/releases/download/v1.1.4/imagecompare-1.1.4-source.tar.gz
        sha256: 6c76d45579fd71dd78498deda6e4bd46f1ba4d2e5bb5ba4fba871b3ec532b2f8
