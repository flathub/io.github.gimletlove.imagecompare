app-id: io.github.gimletlove.imagecompare
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: imagecompare

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

cleanup:
  - /include
  - /lib/girepository-1.0
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/man

modules:
  - name: imagecompare
    buildsystem: cmake-ninja
    config-opts:
      - -DIMAGECOMPARE_FLATPAK=ON
    sources:
      - type: archive
        url: https://github.com/gimletlove/imagecompare/releases/download/v1.3.0/imagecompare-1.3.0-source.tar.gz
        sha256: d5576488ae5700b59622b65ddee8b83eaad5a086a5c4afb8f54785454f66f79a
