app-id: io.github.gimletlove.imagecompare
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: imagecompare

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

cleanup:
  - /include
  - /lib/girepository-1.0
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/man

modules:
  - name: imagecompare
    buildsystem: cmake-ninja
    config-opts:
      - -DIMAGECOMPARE_FLATPAK=ON
    sources:
      - type: archive
        url: https://github.com/gimletlove/imagecompare/releases/download/v1.4.0/imagecompare-1.4.0-source.tar.gz
        sha256: 7f0ae6c18d2f4ea35707f16034ffca983690dc6f55dae9610aa9807d83ecaf8b
