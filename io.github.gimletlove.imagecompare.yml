app-id: io.github.gimletlove.imagecompare
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: imagecompare

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

cleanup:
  - /include
  - /lib/girepository-1.0
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/man

modules:
  - name: imagecompare
    buildsystem: cmake-ninja
    config-opts:
      - -DIMAGECOMPARE_FLATPAK=ON
    sources:
      - type: archive
        url: https://github.com/gimletlove/imagecompare/releases/download/v1.4.2/imagecompare-1.4.2-source.tar.gz
        sha256: de84c06ccab51d3593a4396a907e7f29b790050f752997f729f3eec76aa16a72
