app-id: io.github.gimletlove.imagecompare
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: imagecompare

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

cleanup:
  - /include
  - /lib/girepository-1.0
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/man

modules:
  - name: imagecompare
    buildsystem: cmake-ninja
    config-opts:
      - -DIMAGECOMPARE_FLATPAK=ON
    sources:
      - type: archive
        url: https://github.com/gimletlove/imagecompare/releases/download/v1.4.3/imagecompare-1.4.3-source.tar.gz
        sha256: 3241e54d46da25c483ad601e5c8e170047a46bd47a5a1210721c23aae062beae
