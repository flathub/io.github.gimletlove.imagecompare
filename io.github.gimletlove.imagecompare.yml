app-id: io.github.gimletlove.imagecompare
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: imagecompare

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

cleanup:
  - /include
  - /lib/girepository-1.0
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/man
  - /bin/vips
  - /bin/vipsedit
  - /bin/vipsheader
  - /bin/vipsthumbnail
  
modules:
  - name: vips
    buildsystem: meson
    config-opts:
      - -Ddeprecated=false
      - -Dexamples=false
      - -Dintrospection=disabled
    sources:
      - type: archive
        url: https://github.com/libvips/libvips/releases/download/v8.18.4/vips-8.18.4.tar.xz
        sha256: 2677bad6c422617fd1172d359c16af34e736965d042c214203a87187d26ff037

  - name: imagecompare
    buildsystem: cmake-ninja
    config-opts:
      - -DIMAGECOMPARE_FLATPAK=ON
    sources:
      - type: archive
        url: https://github.com/gimletlove/imagecompare/releases/download/v1.2.1/imagecompare-1.2.1-source.tar.gz
        sha256: fa5e376402cd02513cdc4a7a8614672e9d0d02d41b012243cee4965028223d4a
